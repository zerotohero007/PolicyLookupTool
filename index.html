<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>制度速查 · 差旅费开支管理办法</title>
  <meta name="description" content="内部制度问答试用原型，按条款提供差旅费查询结果。">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">制</span><span>制度速查</span></div>
      <span class="internal-tag">仅供内部使用</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="eyebrow"><span class="eyebrow-dot"></span> 差旅制度 · 2026 修订版</div>
        <h1 id="hero-title">出差政策，<br><em>一问即查。</em></h1>
        <p class="hero-copy">用一句话查询审批、补助与报销规则。每条答复均可回到制度原文核对。</p>
        <div class="hero-meta"><span>生效日期 <b>2026.07.10</b></span><span class="meta-divider"></span><a href="./制度原文_脱敏.pdf" target="_blank" rel="noopener">查看脱敏原文 <span aria-hidden="true">↗</span></a></div>
      </section>

      <div class="content-grid">
        <section class="ask-panel" aria-labelledby="ask-title">
          <div class="section-kicker">ASK THE POLICY <span>01</span></div>
          <h2 id="ask-title">你想了解什么？</h2>
          <form id="search-form" role="search" autocomplete="off">
            <div class="search-wrap">
              <label class="sr-only" for="question">输入制度问题</label>
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="question" name="q" type="search" placeholder="例如：出差伙食补助每天多少钱？" maxlength="120" aria-controls="suggestions" aria-expanded="false">
              <button type="submit" class="search-button" aria-label="查询">查询 <span aria-hidden="true">→</span></button>
            </div>
            <div id="suggestions" class="suggestions" role="listbox" hidden></div>
          </form>
          <p class="search-hint">可直接输入问题，也可点击快捷问题或高频列表。</p>
          <div id="quick-hot" class="quick-hot" aria-label="快速查看高频问题"></div>

          <div id="answer-area" class="answer-area" aria-live="polite">
            <div class="empty-state">
              <div class="empty-icon">↗</div>
              <div><strong>从一个常见问题开始</strong><p>试试“住宿费上限”“报销审批”或“出差补助”。</p></div>
            </div>
          </div>
        </section>

        <aside class="hot-panel" aria-labelledby="hot-title">
          <div class="section-kicker">TRENDING QUESTIONS <span>02</span></div>
          <div class="hot-heading"><h2 id="hot-title">高频问题</h2><span class="flame" aria-hidden="true">✳</span></div>
          <p class="hot-intro">点击问题，直接查看对应条款。</p>
          <div class="category-row" id="category-row" aria-label="问题类别"></div>
          <div id="hot-list" class="hot-list"></div>
        </aside>
      </div>
      <footer><span>内部制度问答试用原型</span><span>依据：差旅费开支管理办法 · 2026 修订版</span></footer>
    </main>
  </div>
</body>
</html>
